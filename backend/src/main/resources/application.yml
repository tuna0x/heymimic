spring:
  application.name: heymimic
  profiles.default: dev
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
server.shutdown: graceful
management:
  endpoints.web.exposure.include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint.health.show-details: never
  metrics.tags.application: ${spring.application.name}
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui.enabled: false
heymimic:
  web.allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    issuer: ${SECURITY_JWT_ISSUER:heymimic}
    audience: ${SECURITY_JWT_AUDIENCE:heymimic-web}
    access-token-ttl: 10m
    private-key: ${SECURITY_JWT_PRIVATE_KEY:}
    public-key: ${SECURITY_JWT_PUBLIC_KEY:}
  jobs:
    enabled: ${JOBS_ENABLED:true}
    worker-id: ${HOSTNAME:local}
    batch-size: 10
    lease: 120s
    poll-interval: 2s
    max-attempts: 5
  events:
    enabled: ${EVENTS_ENABLED:true}
    worker-id: ${HOSTNAME:local}
    batch-size: 10
    lease: 120s
    poll-interval: 2s
    max-attempts: 5
  observability:
    queue-metrics:
      enabled: ${QUEUE_METRICS_ENABLED:true}
      interval: ${QUEUE_METRICS_INTERVAL:PT30S}
      initial-delay: ${QUEUE_METRICS_INITIAL_DELAY:PT5S}
  quotas:
    daily-limits:
      SPEAKING_EVALUATION: 20
      CONTEXT_ANALYSIS: 20
  vocabulary:
    context-analysis-cleanup:
      enabled: ${CONTEXT_ANALYSIS_CLEANUP_ENABLED:true}
      interval: ${CONTEXT_ANALYSIS_CLEANUP_INTERVAL:PT1H}
      batch-size: ${CONTEXT_ANALYSIS_CLEANUP_BATCH_SIZE:100}
    review-session-cleanup:
      enabled: ${REVIEW_SESSION_CLEANUP_ENABLED:true}
      interval: ${REVIEW_SESSION_CLEANUP_INTERVAL:PT15M}
      inactivity-timeout: ${REVIEW_SESSION_INACTIVITY_TIMEOUT:PT24H}
      batch-size: ${REVIEW_SESSION_CLEANUP_BATCH_SIZE:100}
  speaking:
    fake-storage: ${SPEAKING_FAKE_STORAGE:false}
    fake-evaluation: ${SPEAKING_FAKE_EVALUATION:false}
    audio-retention-cleanup:
      enabled: ${SPEAKING_AUDIO_RETENTION_CLEANUP_ENABLED:true}
      interval: ${SPEAKING_AUDIO_RETENTION_CLEANUP_INTERVAL:PT1H}
      batch-size: ${SPEAKING_AUDIO_RETENTION_CLEANUP_BATCH_SIZE:100}
