name: heymimic
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: heymimic
      POSTGRES_USER: heymimic
      POSTGRES_PASSWORD: heymimic_dev
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heymimic -d heymimic"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["heymimic-postgres:/var/lib/postgresql/data"]
  rabbitmq:
    image: rabbitmq:4.2.2-management
    environment:
      RABBITMQ_DEFAULT_USER: heymimic
      RABBITMQ_DEFAULT_PASS: heymimic_dev
      RABBITMQ_DEFAULT_VHOST: heymimic
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes: ["heymimic-rabbitmq:/var/lib/rabbitmq"]
  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  heymimic-rabbitmq:
  heymimic-postgres:

